<!doctype html>
<html><head><meta charset="utf-8"><title>viewer</title>
<style>html,body{margin:0;height:100%;background:#222}#l{position:fixed;left:8px;top:8px;color:#fff;font:14px monospace}</style>
<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }</script>
</head><body><div id="l"></div>
<script type="module">
// Lead's model check: ?m=assets/chars/y3.glb,assets/vehicles/street_taxi_C.glb  Camera sits at -X+Y+Z... looking at origin.
// Red arrow = +X, blue arrow = +Z (heading 0 = forward), green = +Y.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const files = (q.get('m') || 'assets/chars/y3.glb').split(',');
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x8899aa);
s.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.2)); const d = new THREE.DirectionalLight(0xffffff, 2.5); d.position.set(3, 6, 5); s.add(d);
const c = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
const span = files.length * 3.2;
c.position.set(span * 0.5 + 2.5, 3.2, Math.max(7, span * 1.1)); c.lookAt(span * 0.5 - 1.6, 0.8, 0);
s.add(new THREE.GridHelper(40, 40)); window.cam = c;
if (q.get('cam')) { const [x, y, z, tx, ty, tz] = q.get('cam').split(',').map(Number); c.position.set(x, y, z); c.lookAt(tx, ty, tz); }
const L = new GLTFLoader(); const names = [];
files.forEach((f, i) => L.load('../' + f, (g) => {
  const o = g.scene; o.position.x = i * 3.2; s.add(o);
  o.traverse((m) => { if (m.isMesh && (!m.material || !m.material.map) && m.geometry.attributes.color) m.material = new THREE.MeshStandardMaterial({ vertexColors: true }); });
  s.add(new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(i * 3.2, 0.05, 0), 2.6, 0x0044ff));
  s.add(new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(i * 3.2, 0.05, 0), 1.2, 0xff0000));
  names[i] = f.split('/').pop(); document.getElementById('l').textContent = names.join(' | ') + '   blue=+Z red=+X';
  window.__loaded = (window.__loaded || 0) + 1;
}));
r.setAnimationLoop(() => r.render(s, c));
</script></body></html>
