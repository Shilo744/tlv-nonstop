<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLV NONSTOP - תל אביב נון-סטופ</title>
<link rel="stylesheet" href="src/hud.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; font-family: 'Segoe UI', 'Heebo', Arial, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
          color: #fff; background: radial-gradient(circle at 50% 40%, #16264a, #05070d 70%); z-index: 50; transition: opacity .6s; }
  #boot h1 { margin: 0; font-size: clamp(36px, 7vw, 96px); letter-spacing: .04em; font-weight: 900;
             background: linear-gradient(90deg, #ffb347, #ff5e8a, #7a5cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #boot p { margin: 0; opacity: .8; font-size: 18px; }
  #bootbar { width: min(420px, 70vw); height: 8px; border-radius: 8px; background: #ffffff22; overflow: hidden; }
  #bootfill { width: 0; height: 100%; background: linear-gradient(90deg, #ffb347, #ff5e8a); transition: width .3s; }
  #errors { position: fixed; left: 8px; bottom: 8px; max-width: 60vw; max-height: 40vh; overflow: auto; font: 11px/1.3 monospace; color: #ff8080;
            background: #000c; padding: 6px; z-index: 99; display: none; direction: ltr; text-align: left; white-space: pre-wrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="משחק תל אביב נון-סטופ"></canvas>
<div id="hud-root"></div>
<div id="boot" role="status" aria-live="polite">
  <h1>TLV NONSTOP</h1>
  <p id="boottext">טוען את תל אביב...</p>
  <div id="bootbar"><div id="bootfill"></div></div>
</div>
<pre id="errors"></pre>
<script type="module" src="src/main.js"></script>
</body>
</html>
